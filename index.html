<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Country flashcards">
    <meta name="author" content="Andrew Vladelshchikov">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <!--Prevent swiped cards from expanding the viewport-->
    <title>GeoCards - Country Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
</head>
<body>


<!--Content-->
<header>
    <div id="headerTitle">
        <div id="logo">Geo<span>Cards</span></div>
        <div id="tagline">Country Knowledge Trainer</div>
    </div>
    <button id="settingsToggle" onclick="toggleSettings()">⚙ Settings</button>
</header>

<div id="settingsPanel" class="hidden">
    <div class="settingsGroup">
        <div class="settingsLabel">
            <span>Population Range</span>
            <span id="popValues">All countries</span>
        </div>
        <div id="rangeSlider">
            <div id="rangeTrack"></div>
            <div id="rangeFill"></div>
            <input type="range" id="minPopSlider" min="0" value="0">
            <input type="range" id="maxPopSlider" min="0">
        </div>
        <div class="rangeBounds">
            <span id="minRangeLabel">0</span>
            <span id="maxRangeLabel">∞</span>
        </div>
    </div>
    <button id="applyFilter" onclick="applyFilter()">Apply & Restart</button>
</div>

<div id="modeBar">
    <button data-mode="flag" class="active">🏳 Flag</button>
    <button data-mode="name">✏ Name</button>
    <button data-mode="capital">🏛 Capitals</button>
</div>

<div id="statsBar">
    <div class="stat">
        <label>Card</label>
        <p id="statCard">—</p>
    </div>
    <div class="stat">
        <label>Correct</label>
        <p class="good" id="statCorrect">0</p>
    </div>
    <div class="stat">
        <label>Wrong</label>
        <p class="bad" id="statWrong">0</p>
    </div>
    <div class="stat">
        <label>Streak</label>
        <p id="statStreak">0</p>
    </div>
    <div class="stat" id="progressContainer">
        <label>Progress</label>
        <div id="progressBar"><div id="progressFill"></div></div>
    </div>
</div>

<div id="arena">
    <div id="loadingMessage">Fetching countries…</div>
</div>


<!--Scripts-->
<script src="index.js"></script>
<script>
    // Initialize stats
    const correct = document.getElementById('statCorrect');
    const wrong = document.getElementById('statWrong');
    const streak = document.getElementById('statStreak');
    const progress = document.getElementById('statCard');
    const getIndex = () => +correct.textContent + +wrong.textContent;

    // Initialize state
    let mode = 'flag';
    let countries = []; // Unmodified deck
    let deck = []; // Shuffled and appended deck
    let flipped = false;
</script>
<!--Save progress-->
<script>
    const SAVE_KEY = 'geocards';

    // Save after each grading
    function saveSession() {
        try {
            localStorage.setItem(SAVE_KEY, JSON.stringify({ // Can only store string data
                deck:    deck.map(c => c.cca2), // Only store country 2-letter codes
                correct: correct.textContent,
                wrong:   wrong.textContent,
                streak:  streak.textContent,
                mode:    mode,
            }));
        } catch(e) {} // Fail silently if storage full or unavailable
    }

    function loadSession() {
        try {
            const rawData = localStorage.getItem(SAVE_KEY);
            if (!rawData) return false; // Exit if empty

            const data = JSON.parse(rawData);

            // Create a mapping of code to country (faster to look up than traverse an array)
            const byCode = Object.fromEntries(countries.map(c => [c.cca2, c]));

            // Rebuild deck from saved cca2 codes
            deck = (data.deck).map(code => byCode[code])
                .filter(Boolean); // Remove any changed/undefined

            // Populate stats
            correct.textContent = data.correct;
            wrong.textContent   = data.wrong;
            streak.textContent  = data.streak;
            mode                = data.mode;

            // Derive population range from the restored deck
            const deckPops = sortLowToHigh(deck.map(c => c.population));
            popMin = deckPops[0];
            popMax = deckPops.at(-1);

            // Sync the mode button UI to match
            document.querySelectorAll('#modeBar button:not(:disabled)')
                .forEach(button => button.classList.toggle('active', button.dataset.mode === mode));

            // Sync the settings UI to match
            minSlider.value = populationRangeValues.indexOf(formatPopulation(popMin));
            maxSlider.value = populationRangeValues.indexOf(formatPopulation(popMax));
            updateRangeUI();

            showToast('Resumed');

            return true;
        } catch(e) {return false;}
    }

    function showToast(message) {
        const toast = document.createElement('output');
        toast.role = 'status';
        toast.className = 'toast';
        toast.textContent = message;
        toast.addEventListener('animationend', e => e.animationName === 'hideToast' && toast.remove());
        document.body.appendChild(toast);
    }

    // Only clear when game is complete. Progress in a new mode will override
    function clearSession() {
        try {
            localStorage.removeItem(SAVE_KEY);
        } catch(e) {} // Fail silently if storage unavailable
    }
</script>
<!--Define deck-->
<script>
    function newDeck() {
        deck = filterDeck(countries, {min: popMin, max: popMax});

        correct.textContent = '0';
        wrong.textContent = '0';
        streak.textContent = '0';
        progress.textContent = `1 / ${deck.length}`;
        document.getElementById('progressFill').style.width = '0%';

        nextCard();
    }
</script>
<!--Load country data-->
<script>
    let populationRangeValues; // Idx to value used for sliders (unique, formatted populations)
    let byFormatting; // For applyFilter() (mapping of all pop values that belong to a single formatted population)

    fetch('https://restcountries.com/v3.1/all?fields=name,flags,cca2,capital,population,region,subregion')
        .then(response => response.json())
        .then(json => countries = json)
        .then(() => {
            populationRangeValues = [...new Set(sortLowToHigh(countries.map(c => c.population)).map(formatPopulation))];
            byFormatting = countries.reduce((acc, {population}) => {
                let idx = formatPopulation(population);
                acc[idx] = acc[idx] || [];
                acc[idx].push(population);
                return acc;
            }, {});
            initSliders();
        })
        .then(() => loadSession() ? nextCard(): newDeck())
        .catch(() => document.getElementById('arena').innerHTML =
            `<p id="errorMessage">Failed to load countries. Check your connection.</p>`
        );
</script>
<script>
    // Constants that get swapped between
    const frontFlipInfo = '↩ Flip to reveal answer';
    const backFlipInfo = '↩ Flip back';

    const frontActionBar = `<button id="flip" onclick="flipCard()">Reveal Answer</button>`;
    const backActionBar = `<button id="wrong" onclick="grade(false)">✗ Wrong</button><button id="correct" onclick="grade(true)">✓ Correct</button>`;
    const restartActionBar = `<button id="restart" onclick="newDeck()">↺ New Session</button>`;

    const frontKeyboardHints = `<span>← skip</span><span>⌴ flip</span><span class="key">→ skip</span>`;
    const backKeyboardHints = `<span>← wrong</span><span>⌴ flip</span><span class="key">→ correct</span>`;
</script>
<!--Flip card-->
<script>
    function flipCard() {
        const card = document.getElementById('card');

        flipped = !flipped;
        card.classList.toggle('flipped', flipped);

        // Release in-flight mouse/touch interaction
        card.dispatchEvent(new MouseEvent('mouseup',  {bubbles: true}));
        card.dispatchEvent(new TouchEvent('touchend', {bubbles: true}));

        // Update info, action bar, and keyboard hints
        document.getElementById('flipInfo').textContent    = flipped ? backFlipInfo : frontFlipInfo;
        document.getElementById('actionBar').innerHTML     = flipped ? backActionBar : frontActionBar;
        document.getElementById('keyboardHints').innerHTML = flipped ? backKeyboardHints : frontKeyboardHints;
    }
</script>
<!--Create card-->
<script>
    const arena = document.getElementById('arena');

    // Grading does the actual shifting of the index
    function nextCard() {
        if (getIndex() >= deck.length) return finish();

        flipped = false;
        progress.textContent = `${getIndex() + 1} / ${deck.length}`;
        document.getElementById('progressFill').style.width = `${getIndex() / deck.length * 100}%`;

        const {
            name :{common},
            flags: {png, alt},
            capital, // This is an array
            population,
            region,
            subregion,
        } = deck[getIndex()];

        const faceCard = (() => {
            switch (mode) {
                case 'flag': return `<img src="${png}" alt="${alt}">`;
                case 'name': return `<h1>${common}</h1>`;
                // TODO: Filter out countries without a capital city (ex. Heard Island and McDonald Islands)
                case 'capital': return `<h1>${capital?.length ? capital.join(', ') : 'No capital'}</h1>`;
            }})();

        arena.innerHTML = `
            <div id="card">
                <div class="cardFace front">
                    <div class="cardNum">${progress.textContent}</div>
                    <div class="cardLabel">Do you know this country?</div>
                    ${faceCard}
                </div>
                <div class="cardFace back">
                    <div class="cardNum">${progress.textContent}</div>
                    <div class="cardLabel">Answer</div>
                    <img src="${png}" alt="${alt}">
                    <h1 id="countryName">${common}</h1>
                    <p id="countryInfo">
                        ${capital?.length ? capital.join(', ') : 'No capital'} · ${region}${subregion ? ' · ' + subregion : ''}<br>
                        ${formatPopulation(population) ?? 'Unknown population'}
                    </p>
                </div>
            </div>
            <p id="keyboardHints">${frontKeyboardHints}</p>
            <p id="flipInfo" onclick="flipCard()">${frontFlipInfo}</p>
            <div id="actionBar">${frontActionBar}</div>
        `;

        attachSwipe();
    }
</script>
<!--Finish game-->
<script>
    function finish() {
        clearSession();

        const pct = Math.round(correct.textContent / deck.length * 100);

        const message = (() => {
            switch (true) {
                case pct === 100: return `Perfect score!`;
                case pct >= 80:   return `Impressive!`;
                case pct >= 60:   return `Nice try!`;
                default:          return `Keep at it!`;
            }})();

        progress.textContent = '✓';
        document.getElementById('progressFill').style.width = '100%';
        arena.innerHTML = `
            <div id="done">
                <div class="label">Session Complete</div>
                <div id="score">${pct}%</div>
                <div class="label">${correct.textContent} correct · ${wrong.textContent} wrong</div>
                <div id="message">${message}</div>
                <div id="actionBar">${restartActionBar}</div>
            </div>
        `;
    }
</script>
<!--Grade card-->
<script>
    let lock = false;

    function grade(direction) {
        if (lock++) return; // Prevents multiple grades being queued up during timeout

        swipeController?.abort(); // Release all card listeners

        const card = document.getElementById('card');
        const front = document.querySelector('.front');
        const back = document.querySelector('.back');

        front.classList.toggle('skipOverlay',   !flipped);
        back.classList.toggle('correctOverlay',  flipped && direction);
        back.classList.toggle('wrongOverlay',    flipped && !direction);

        const flyX = (flipped ^ direction ? 0.75 : -0.75) * window.innerWidth;
        const rot  = flipped ^ direction ? MAX_ROT : -MAX_ROT;
        card.style.transition = ''; // Remove "none" transition
        // Removes perspective transition to prevent warping
        card.style.transform  = `${flipped ? 'rotateY(180deg)' : ''} translateX(${flyX}px) rotate(${rot}deg)`;
        setTimeout(() => addGrade(flipped), SWIPE_DURATION);

        function addGrade(value) {
            if (value) {
                if (direction) { // Correct
                    correct.textContent++;
                    streak.textContent++;
                } else { // Incorrect
                    deck.push(deck[getIndex()]);
                    wrong.textContent++;
                    streak.textContent = '0';
                }
            } else { // Skip
                deck.push(...deck.splice(getIndex(), 1));
            }

            saveSession();
            nextCard();
            lock = false;
        }
    }
</script>
<!--Switch mode buttons-->
<script>
    const modeButtons = document.querySelectorAll('#modeBar button:not(:disabled)');

    for (const button of modeButtons) {
        button.addEventListener('click', () => {
            if (button.classList.contains('active')) return;

            modeButtons.forEach(otherButton => otherButton.classList.remove('active'));
            button.classList.add('active');

            mode = button.dataset.mode;
            newDeck();
        });
    }
</script>
<!--Settings panel-->
<script>
    function toggleSettings() {
        document.getElementById('settingsPanel').classList.toggle('hidden');
        document.getElementById('settingsToggle').classList.toggle('active');
    }
</script>
<!--Population filter-->
<script>
    let popMin = 0;
    let popMax = Infinity;
    let maxPopIdx; // Index length of unique, formatted populations

    const fill = document.getElementById('rangeFill');
    // Return idx
    const minSlider = document.getElementById('minPopSlider');
    const maxSlider = document.getElementById('maxPopSlider');

    function updateRangeUI() {
        const minRangeIdx = +minSlider.value;
        const maxRangeIdx = +maxSlider.value;

        // Position the fill between the two thumbs
        const minPct = (minRangeIdx / maxPopIdx) * 100;
        const maxPct = (maxRangeIdx / maxPopIdx) * 100;
        fill.style.left = minPct + '%';
        fill.style.width = (maxPct - minPct) + '%';

        // Update range label
        const label = (minRangeIdx === 0 && maxRangeIdx === maxPopIdx)
            ? 'All countries'
            : `${populationRangeValues[minRangeIdx]} - ${populationRangeValues[maxRangeIdx]}`;
        document.getElementById('popValues').textContent = label;
    }

    function initSliders() {
        maxPopIdx = populationRangeValues.length - 1;

        maxSlider.value = minSlider.max = maxSlider.max = maxPopIdx;

        document.getElementById('maxRangeLabel').textContent = populationRangeValues.at(-1);

        updateRangeUI();

        // Enforce min <= max
        minSlider.addEventListener('input', () => +minSlider.value > +maxSlider.value
            ? minSlider.value = maxSlider.value
            : updateRangeUI()
        );
        maxSlider.addEventListener('input', () => +maxSlider.value < +minSlider.value
            ? maxSlider.value = minSlider.value
            : updateRangeUI()
        );
    }

    function applyFilter() {
        // Since multiple countries can have the same formatted value, we want to make sure to include them all
        popMin = Math.min(...byFormatting[populationRangeValues[minSlider.value]]);
        popMax = Math.max(...byFormatting[populationRangeValues[maxSlider.value]]);

        toggleSettings();
        newDeck();
    }
</script>
<!--Keybindings-->
<script>
    document.addEventListener('keydown', e => {
        // TODO: disable keybindings on finish screen
        if (e.code === 'Space') {e.preventDefault(); flipCard();}
        if (e.code === 'ArrowRight') grade(true);
        if (e.code === 'ArrowLeft')  grade(false);
    });
</script>
<!--Swipe/drag card-->
<script>
    // TODO: Switch thresholds to be relative to window size (alongside Math.min())
    const THRESHOLD = 80; // How many pixels of translation before swipe can be released
    const SWIPE_THRESHOLD = 20; // How many pixels of translation before considered a swipe
    const MAX_ROT = 20; // Max degrees of card rotation
    const OVERLAY_THRESHOLD = THRESHOLD * 0.8; // When the overlay should appear
    const SWIPE_DURATION = 300; // Number of milliseconds that the swipe animation will play

    let swipeController; // AbortController for current card's listeners

    function attachSwipe() {
        swipeController = new AbortController();
        const {signal} = swipeController;

        const card = document.getElementById('card');
        const front = document.querySelector('.front');
        const back = document.querySelector('.back');

        let startX, startY, curX = 0;
        let isDragging = false;
        let startZ;

        // Add listeners
        card.addEventListener('mousedown',  onStart, {signal});
        card.addEventListener('touchstart', onStart, {signal});

        // Split to eat click on flip
        front.addEventListener('click', flipCard, {signal});
        back.addEventListener('click',  flipCard, {signal});

        function setOverlay(direction) {
            front.classList.toggle('skipOverlay',   !flipped);
            back.classList.toggle('correctOverlay',  flipped && direction);
            back.classList.toggle('wrongOverlay',    flipped && !direction);
        }

        function clearOverlay() {
            front.classList.remove('skipOverlay');
            back.classList.remove('correctOverlay');
            back.classList.remove('wrongOverlay');
        }

        const pos = (e, calcOffset = false) => {
            const p = e.touches?.[0] ?? e;
            return calcOffset ? [p.clientX - startX, p.clientY - startY] : [p.clientX, p.clientY];
        };

        function onStart(e) {
            startZ = flipped;

            curX = 0;
            isDragging = false;
            [startX, startY] = pos(e);

            // Start tracking movement
            document.addEventListener('mousemove', onMove, {signal});
            document.addEventListener('touchmove', onMove, {signal, passive: false}); // False for Safari default
            document.addEventListener('mouseup',   onEnd, {signal});
            document.addEventListener('touchend',  onEnd, {signal});
        }

        function onMove(e) {
            const [changeX, changeY] = pos(e, true);
            e.preventDefault(); // Mobile devices slow down significantly if scrolling is allowed

            // Abort if scrolling vertically
            if (!isDragging && Math.abs(changeY) > SWIPE_THRESHOLD) return cleanup();

            if (Math.abs(changeX) > SWIPE_THRESHOLD) isDragging = true;
            if (!isDragging) return;

            // Prevent drag click from flipping
            front.removeEventListener('click', flipCard);
            back.removeEventListener('click', flipCard);

            card.style.transition = 'none'; // Prevents lag when dragging the element

            const flipMult = flipped ? -1 : 1;
            curX = changeX;
            const rot = (changeX / window.innerWidth) * MAX_ROT * 0.5; // 0.5x so it keeps rotating after release
            // Card follows behind cursor at 0.5x
            card.style.transform = `${flipped ? 'rotateY(180deg)' : ''} translateX(${changeX * 0.5 * flipMult}px) rotate(${rot * flipMult}deg)`;

            if (changeX > OVERLAY_THRESHOLD) return setOverlay(true);
            if (changeX < -OVERLAY_THRESHOLD) return setOverlay(false);
            clearOverlay();
        }

        function onEnd() {
            cleanup();

            if (Math.abs(curX) > THRESHOLD && flipped === startZ) return grade(curX > 0);

            // Reset color and position
            clearOverlay();
            card.style.transform = '';
        }

        function cleanup() {
            card.style.transition = ''; // Remove "none" transition

            // Release listeners
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('mouseup',   onEnd);
            document.removeEventListener('touchend',  onEnd);

            // Re-enable only after the card stops moving
            requestAnimationFrame(() => {
                front.addEventListener('click', flipCard, {signal});
                back.addEventListener('click',  flipCard, {signal});
            });
        }
    }
</script>
